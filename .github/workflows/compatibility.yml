name: Official Windows structural compatibility

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-windows-compatibility
  cancel-in-progress: false

jobs:
  official-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure only the compatibility probe
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=OFF
      - name: Build only our read-only probe
        run: cmake --build build --config Release --target AZSSpeedGearProbe --parallel 2
      - name: Check the official EXE without running it
        id: monitor
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $summaryLines = @(python tools/check_game_compatibility.py --probe build/Release/AZSSpeedGearProbe.exe --output compatibility/windows.json)
          $monitorExit = $LASTEXITCODE
          $summaryLines | ForEach-Object { Write-Output $_ }
          if ($monitorExit -notin @(0, 1)) { exit $monitorExit }
          if ($summaryLines.Count -ne 1) { throw 'The monitor did not return its structured completion summary.' }
          $summary = $summaryLines[0] | ConvertFrom-Json
          $expected = if ($monitorExit -eq 0) { 'structural_only' } else { 'unsupported' }
          if ($summary.status -cne $expected) { throw 'Monitor completion does not match its exit status.' }
          "exit_code=$monitorExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0
      - name: Commit only the fixed JSON report
        shell: pwsh
        run: |
          $reportPath = 'compatibility/windows.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Compatibility report was not produced.' }
          git add -- $reportPath
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage the fixed compatibility report.' }
          $staged = @(git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect staged paths.' }
          if (@($staged | Where-Object { $_ -cne $reportPath }).Count -gt 0) { throw 'Refusing to commit another path.' }
          git diff --cached --quiet -- $reportPath
          $difference = $LASTEXITCODE
          if ($difference -eq 0) { Write-Output 'Compatibility report is unchanged.'; exit 0 }
          if ($difference -ne 1) { throw 'Cannot inspect the report difference.' }
          git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit --only -m 'chore: update official Windows compatibility report' -- $reportPath
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit the report.' }
          git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent main changes could not be rebased safely; no force push is permitted.' }
          git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'Report push failed; no force push or unrelated changes are permitted.' }
      - name: Mark unsupported structures as a failed check
        if: steps.monitor.outputs.exit_code == '1'
        shell: pwsh
        run: |
          throw 'The official Windows EXE failed loader/scanner compatibility checks. The unsupported JSON report was retained; gameplay was not tested.'
      # No game executable, compressed payload, cache or build artifact is
      # uploaded. Only compatibility/windows.json can enter Git history.
